<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Donvai!</title>

<style>
  /* Internal CSS */
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center; /* center horizontal */
    align-items: center;     /* center vertical */
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') no-repeat center center/cover;
  }

  .login-box {
    width: 320px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.15); /* transparent background */
    backdrop-filter: blur(10px); /* glass effect */
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    text-align: center;
    color: white;
  }

  .login-box h2 {
    margin-bottom: 20px;
    font-size: 24px;
  }

  .login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    border-radius: 8px;
    outline: none;
    color: white;
    font-size: 14px;
  }

  .login-box input::placeholder {
    color: rgba(255, 255, 255, 0.7);
  }

  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: rgba(0, 123, 255, 0.8);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .login-box button:hover {
    background: rgba(0, 123, 255, 1);
  }

  #msg {
    margin-top: 10px;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm"action="" method="post">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p id="msg"></p>
  </div>

<script>
  // Internal JS
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault(); // page reload na ho

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;
    let msg = document.getElementById("msg");

    // Demo check - tum apna logic yaha daal sakte ho
    if(user === "admin" && pass === "1234@12"){
      msg.style.color = "lightgreen";
      window.location.href = "afterlogin/index.html";
    } else {
      msg.style.color = "red";
      msg.innerText = "Wrong Username or Password";
      alert("pls ask sadananda regon for user id password");
    
    }
  });
</script>

</body>
</html>
