<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Welcome to Donvai!</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;

    background: #000;
}


/* ========================================
   GITHUB BACKGROUND IMAGE
   ======================================== */

body::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        url("https://raw.githubusercontent.com/Donvai123/regon.sada/main/login/20260827_182233.jpg")
        no-repeat center center / cover;

    opacity: 0.55;

    z-index: 0;
}


/* Dark transparent overlay */

body::after {

    content: "";

    position: absolute;

    inset: 0;

    background: rgba(0, 0, 0, 0.25);

    z-index: 0;
}


/* ========================================
   LOGIN BOX
   ======================================== */

.login-box {

    position: relative;

    z-index: 1;

    width: 320px;

    padding: 30px;

    background:
        rgba(255, 255, 255, 0.15);

    backdrop-filter: blur(10px);

    border-radius: 15px;

    border:
        1px solid rgba(255, 255, 255, 0.3);

    box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3);

    text-align: center;

    color: white;
}


.login-box h2 {

    margin-bottom: 20px;

    font-size: 24px;

}


.login-box input {

    width: 100%;

    padding: 12px;

    margin: 10px 0;

    background:
        rgba(255, 255, 255, 0.2);

    border: none;

    border-radius: 8px;

    outline: none;

    color: white;

    font-size: 14px;

}


.login-box input::placeholder {

    color:
        rgba(255, 255, 255, 0.7);

}


.login-box button {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    background:
        rgba(0, 123, 255, 0.8);

    border: none;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;

}


.login-box button:hover {

    background:
        rgba(0, 123, 255, 1);

}


#msg {

    margin-top: 10px;

    font-size: 14px;

    line-height: 1.5;

}

</style>

</head>


<body>


<div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="username"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Log In
        </button>

    </form>

    <p id="msg"></p>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendEmailVerification,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAj-LOc7fbr1xFs_iNxFwyULwrBUKI-r4k",

    authDomain:
    "donvai-281a0.firebaseapp.com",

    projectId:
    "donvai-281a0",

    storageBucket:
    "donvai-281a0.firebasestorage.app",

    messagingSenderId:
    "19064202332",

    appId:
    "1:19064202332:web:e97db30e47c20a6c6cb299"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const loginForm =
    document.getElementById("loginForm");

const msg =
    document.getElementById("msg");


loginForm.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const email =
            document
            .getElementById("username")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        msg.innerText =
            "Checking login...";

        msg.style.color =
            "white";


        try {

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                userCredential.user;


            if (!user.emailVerified) {

                msg.innerText =
                    "Sending verification email...";

                msg.style.color =
                    "orange";

                await sendEmailVerification(user);

                msg.innerText =
                    "Verification email sent! Check your email and verify it.";

                await signOut(auth);

                return;
            }


            msg.innerText =
                "Login successful!";

            msg.style.color =
                "lightgreen";


            setTimeout(
                () => {

                    window.location.href =
                        "../afterlogin/";

                },
                500
            );

        }


        catch(error) {

            console.error(
                "Firebase error:",
                error
            );

            msg.style.color =
                "red";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                msg.innerText =
                    "Wrong Email or Password.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                msg.innerText =
                    "Bhai thoda der baad try karo.";

            }

            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                msg.innerText =
                    "Internet connection check karo.";

            }

            else if (
                error.code ===
                "auth/quota-exceeded"
            ) {

                msg.innerText =
                    "Email verification limit reached. Try again later.";

            }

            else {

                msg.innerText =
                    "Something went wrong. Please try again.";

            }

        }

    }
);

</script>

</body>

</html>
