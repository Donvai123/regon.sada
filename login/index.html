<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Donvai!</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb')
      no-repeat center center/cover;
  }

  .login-box {
    width: 320px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    text-align: center;
    color: white;
  }

  .login-box h2 {
    margin-bottom: 20px;
    font-size: 24px;
  }

  .login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    border-radius: 8px;
    outline: none;
    color: white;
    font-size: 14px;
  }

  .login-box input::placeholder {
    color: rgba(255, 255, 255, 0.7);
  }

  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: rgba(0, 123, 255, 0.8);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .login-box button:hover {
    background: rgba(0, 123, 255, 1);
  }

  #msg {
    margin-top: 10px;
    font-size: 14px;
  }
</style>
</head>

<body>

  <div class="login-box">

    <h2>Login</h2>

    <form id="loginForm">

      <input
        type="email"
        id="username"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Log In</button>

    </form>

    <p id="msg"></p>

  </div>


<script type="module">

  // Firebase SDK
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // Firebase configuration
  const firebaseConfig = {

    apiKey: "AIzaSyAj-LOc7fbr1xFs_iNxFwyULwrBUKI-r4k",

    authDomain: "donvai-281a0.firebaseapp.com",

    projectId: "donvai-281a0",

    storageBucket: "donvai-281a0.firebasestorage.app",

    messagingSenderId: "19064202332",

    appId: "1:19064202332:web:e97db30e47c20a6c6cb299"

  };


  // Firebase initialize
  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  // Login form
  const loginForm = document.getElementById("loginForm");

  const msg = document.getElementById("msg");


  loginForm.addEventListener("submit", async function(e) {

    e.preventDefault();


    const email =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;


    msg.innerText = "Logging in...";
    msg.style.color = "white";


    try {

      // Firebase login
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      // Login successful
      msg.innerText = "Login successful!";
      msg.style.color = "lightgreen";


      // Go to protected page
      window.location.href = "../afterlogin/";


    } catch (error) {

      console.log(error);

      msg.innerText = "Wrong Email or Password";
      msg.style.color = "red";

    }

  });

</script>

</body>
</html>
