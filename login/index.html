<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Welcome to Donvai!</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}


body {

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
    url('https://images.unsplash.com/photo-1506744038136-46273834b3fb')
    no-repeat center center/cover;

}


.login-box {

    width: 320px;

    padding: 30px;

    background:
    rgba(255, 255, 255, 0.15);

    backdrop-filter: blur(10px);

    border-radius: 15px;

    border:
    1px solid rgba(255, 255, 255, 0.3);

    box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.3);

    text-align: center;

    color: white;

}


.login-box h2 {

    margin-bottom: 20px;

    font-size: 24px;

}


.login-box input {

    width: 100%;

    padding: 12px;

    margin: 10px 0;

    background:
    rgba(255, 255, 255, 0.2);

    border: none;

    border-radius: 8px;

    outline: none;

    color: white;

    font-size: 14px;

}


.login-box input::placeholder {

    color:
    rgba(255, 255, 255, 0.7);

}


.login-box button {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    background:
    rgba(0, 123, 255, 0.8);

    border: none;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;

}


.login-box button:hover {

    background:
    rgba(0, 123, 255, 1);

}


#msg {

    margin-top: 10px;

    font-size: 14px;

    line-height: 1.5;

}

</style>

</head>


<body>


<div class="login-box">

    <h2>Login</h2>


    <form id="loginForm">

        <input
            type="email"
            id="username"
            placeholder="Email"
            required
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Log In
        </button>

    </form>


    <p id="msg"></p>

</div>



<script type="module">

// ========================================
// FIREBASE SDK
// ========================================

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


// Firebase config

const firebaseConfig = {

    apiKey:
    "AIzaSyAj-LOc7fbr1xFs_iNxFwyULwrBUKI-r4k",

    authDomain:
    "donvai-281a0.firebaseapp.com",

    projectId:
    "donvai-281a0",

    storageBucket:
    "donvai-281a0.firebasestorage.app",

    messagingSenderId:
    "19064202332",

    appId:
    "1:19064202332:web:e97db30e47c20a6c6cb299"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


// ===============================
// CHECK LOGIN
// ===============================

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href =
            "../";

        return;
    }


    // Email verification check

    if (!user.emailVerified) {

        signOut(auth);

        window.location.href =
            "../";

        return;
    }

});


// ===============================
// LOGOUT
// ===============================

const logoutBtn =
    document.getElementById("logoutBtn");


if (logoutBtn) {

    logoutBtn.addEventListener(
        "click",
        async () => {

            try {

                await signOut(auth);

                // Login page
                window.location.href =
                    "../";

            }

            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }

        }
    );

}


// ===============================
// MOBILE MENU
// ===============================

const menuBtn =
    document.getElementById("menuBtn");

const navMenu =
    document.getElementById("navMenu");


if (menuBtn && navMenu) {

    menuBtn.addEventListener(
        "click",
        () => {

            navMenu.classList.toggle(
                "active"
            );

        }
    );

}

</script>


</body>

</html>
